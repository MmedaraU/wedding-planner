<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wedding Planner</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400..700&display=swap"
    rel="stylesheet">
</head>

<body>
  <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
  <div id="menu-backdrop" class="menu-backdrop"></div>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">Wedding Planner</div>
      <div class="sidebar-search">
        <input type="search" id="global-search" placeholder="Search everything…">
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <span id="status" class="status">Loading…</span>
        <button id="refresh-btn" class="btn btn-ghost">Refresh</button>
      </div>
    </aside>

    <main id="view" class="view"></main>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-content">
      <h2 id="modal-title"></h2>
      <form id="modal-form"></form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="app.js?v=22"></script>
</body>

</html>
